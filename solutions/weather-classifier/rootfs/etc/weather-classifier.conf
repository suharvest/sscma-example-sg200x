# Weather Classifier Configuration
# ReCamera scene weather classification (MobileNetV3-Small, 5 classes)

# Model / labels
MODEL=/userdata/local/models/weather_mobilenetv3_small_bf16.cvimodel
LABELS=/usr/share/weather-classifier/labels.txt

# MQTT configuration
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/weather/results

# Video streaming
RTSP_ENABLED=1
STREAM_WIDTH=1280
STREAM_HEIGHT=720
STREAM_FPS=15

# Inference settings
CAMERA_WIDTH=640
CAMERA_HEIGHT=480
CAMERA_FPS=10

# Console print throttle (frames between [RESULT] lines)
PRINT_INTERVAL=30

# Logging
VERBOSE=0
