# QR Code Reader Configuration
# ReCamera multi-QR-code decoding (quirc, CPU)

# MQTT configuration
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/qrcode-reader/results

# Video streaming
RTSP_ENABLED=1
STREAM_WIDTH=1920
STREAM_HEIGHT=1080
STREAM_FPS=30

# Inference (QR detection) frame
CAMERA_WIDTH=640
CAMERA_HEIGHT=640
CAMERA_FPS=10

# Console print throttle (frames between [RESULT] lines)
PRINT_INTERVAL=30

# Logging
VERBOSE=0
