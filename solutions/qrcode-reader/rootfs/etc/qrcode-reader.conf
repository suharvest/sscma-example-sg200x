# QR Code Reader Configuration
# ReCamera multi-QR-code decoding (quirc, CPU)

# MQTT configuration
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/qrcode-reader/results

# Video streaming
RTSP_ENABLED=1
STREAM_WIDTH=1280
STREAM_HEIGHT=720
STREAM_FPS=30

# Inference (QR detection) frame.
# Higher than a typical detector input on purpose: quirc needs enough pixels
# per QR module, and the code usually fills only part of the frame. 640x640
# left real-world codes (esp. phone screens) undecodable. 1280x720 matches the
# sensor aspect (no anamorphic squish of the finder patterns) and ~2.25x the area.
CAMERA_WIDTH=1280
CAMERA_HEIGHT=720
CAMERA_FPS=10

# Console print throttle (frames between [RESULT] lines)
PRINT_INTERVAL=30

# Logging
VERBOSE=0
