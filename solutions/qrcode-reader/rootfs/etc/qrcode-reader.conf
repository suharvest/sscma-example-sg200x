# QR Code Reader Configuration
# ReCamera multi-QR-code decoding (quirc, CPU)

# MQTT configuration
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/qrcode-reader/results

# Video streaming
RTSP_ENABLED=1
STREAM_WIDTH=1280
STREAM_HEIGHT=720
STREAM_FPS=30

# Inference (QR detection) frame.
# Default 640x360 @ 20fps provides low-latency detection with hardware Y-plane.
# High resolution 1280x720 @ 10fps is also supported via config if tiny QR codes
# or dense modules require extra resolution.
CAMERA_WIDTH=640
CAMERA_HEIGHT=360
CAMERA_FPS=20

# Console print throttle (frames between [RESULT] lines)
PRINT_INTERVAL=30

# Logging
VERBOSE=0
