# Microduck Pose QA Configuration for reCamera SG2002

# Model configuration
MODEL_PATH="/userdata/local/models/microduck_pose_17kpt_384_int8.cvimodel"

# Detection confidence thresholds
CONFIDENCE=0.60
KEYPOINT_CONFIDENCE=0.45

# MQTT reporting
MQTT_HOST="127.0.0.1"
MQTT_PORT=1883
MQTT_TOPIC="recamera/microduck-pose-qa/results"
MQTT_ALARM_TOPIC="factory/microduck/qa/alarm"

# Kinematic QA Tolerances
GEAR_TOOTH_TOLERANCE_DEG=7.0
BILATERAL_HEIGHT_TOLERANCE_PX=12.0
POSTURE_DRIFT_TOLERANCE_MM=3.0

# Streaming and Debug
DEBUG_PORT=8001
DEBUG_ENABLED=1
CONTROL_PORT=8082
VERBOSE=1

# Stand-pose standard: 2-D thigh angles (hip_pitch -> knee), their disparity and the trunk tilt
# as seen by THIS camera placement. Read by the daemon at start and whenever this file changes;
# rewritten by POST /api/control {"method": "calibrate_stand"} (golden sample standing in view)
# or {"method": "set_stand_nominal", ...}. The values below are the Stage-1 simulator camera's;
# calibrate after installing or moving the camera.
NOMINAL_STAND_THETA_L_DEG=-20.400
NOMINAL_STAND_THETA_R_DEG=-55.590
NOMINAL_STAND_DISPARITY_DEG=35.190
NOMINAL_STAND_SPINE_TILT_DEG=14.820

# Microphone gain applied by the init script before the daemon starts: ALSA card 0
# 'ADC Capture Volume' (cv182xa_adc), full scale 24, reCamera factory value 0 (recordings at
# 0 are ~-47 dBFS for a speaker at bench distance). Not restored on stop.
MIC_CAPTURE_VOLUME=12
