# Face Analysis Configuration
# ReCamera Face Analysis Application

# Model paths
# Face detector: yolov8n-face INT8 (community jalonso/yolov8face). Requires the
# 3 sscma-micro YoloV8 multi-output bug fixes (PRs at Seeed-Studio/SSCMA-Micro).
FACE_MODEL=/userdata/local/models/yolov8n_face_cv181x_int8.cvimodel
# Age/Gender: DEX MobileNetV2 INT8, 160x160 input (3.0 MB). Continuous age,
# published as both `age` and `age_bin`; no race output. Measured on device
# (INT8, FairFace val 10954 / UTKFace val 2000) vs FairFace ResNet34:
# gender 94.1% vs 94.4%, 9-bin age 58.4% vs 60.3%, UTKFace age MAE 4.44 vs
# 5.12 yrs, 14.3 ms vs 28.9 ms per face.
GENDERAGE_MODEL=/userdata/local/models/dex_age_gender_mnv2_160_int8.cvimodel
# Alternative: FairFace ResNet34 INT8 (9 age bins + 7-class race).
#GENDERAGE_MODEL=/userdata/local/models/fairface_int8.cvimodel
# DEX only: frames whose age-distribution variance (years^2) exceeds
# AGE_MAX_VARIANCE are not used for the track's age; AGE_EMA_ALPHA is the
# weight of the previous smoothed age (0..1). With 90, 96% of UTKFace val
# frames pass (MAE 4.2 kept vs 9.3 rejected).
AGE_MAX_VARIANCE=90
AGE_EMA_ALPHA=0.75
EMOTION_MODEL=/userdata/local/models/enet_b0_8_best_afew_cv181x_bf16.cvimodel

# Run emotion every N frames (1 = every frame, 2 = every 2 frames, ...)
EMOTION_INTERVAL=2

# Attribute quality gate: faces whose SHORT SIDE is below this many pixels in
# the inference frame (INFERENCE_WIDTH x INFERENCE_HEIGHT below) skip the
# age/gender/race and emotion stages entirely -- at that size the crop reaching
# a 224x224 classifier is mostly interpolation, and the heads still emit a
# confident-looking label that would poison the track's accumulated evidence.
# Such faces are still detected, tracked and published, marked "gated": true,
# and the overlay labels them "face" rather than showing default attributes.
# Lower this to analyse faces further from the camera, at the cost of accuracy.
MIN_FACE_PX=64

# Detection threshold (0.0 - 1.0)
FACE_THRESHOLD=0.5

# MQTT configuration
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/face-analysis/results

# Face blur is configured device-wide in /userdata/local/blur.conf, written by
# the console. It used to be a BLUR_ENABLED key here as well, which meant two
# files with the same key name disagreeing: this one was translated into
# --no-blur before the device-wide setting was even read, so switching blur on
# in the console did nothing. One switch, one place.
MAX_REGIONS=12

# Video streaming
RTSP_ENABLED=1
STREAM_WIDTH=1280
STREAM_HEIGHT=720
STREAM_FPS=15

# Inference settings
INFERENCE_WIDTH=640
INFERENCE_HEIGHT=480
INFERENCE_FPS=10

# Logging
VERBOSE=0
