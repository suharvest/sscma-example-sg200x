# Retail Vision Configuration
# This file is sourced by /etc/init.d/K92retail-vision.
# All settings are optional; uncomment to override the defaults.
# Do NOT put "-m <model>" here: the init script always passes the model
# path explicitly (default or the console-managed override file
# /userdata/local/apps/retail-vision.model).

# MQTT broker (defaults: localhost:1883, topic recamera/retail-vision/vision)
#MQTT_HOST=192.168.1.100
#MQTT_PORT=1883
#MQTT_TOPIC=recamera/retail-vision/vision

# Debug WebSocket stream for the console Live page (default: enabled, port 8001)
#DEBUG_ENABLED=0
#DEBUG_PORT=8001

# Extra flags appended to the daemon command line, e.g.:
#DAEMON_OPTS="$DAEMON_OPTS --conf-threshold 0.6 --window-duration 120"
