# fitness-trainer configuration (sourced by /etc/init.d/K92fitness-trainer)
#
# The workout settings (exercise, reps, sets) normally come from the console,
# which writes /userdata/local/apps/fitness-trainer.config.json. The variables
# here are the escape hatch for a device dedicated to one movement -- when set
# they override the console for every run.

# MQTT broker (falls back to /etc/recamera.conf, then localhost:1883)
#MQTT_HOST=localhost
#MQTT_PORT=1883
#MQTT_TOPIC=recamera/fitness-trainer/results

# Pose model. Default is the YOLO11n-Pose that ships with the supervisor.
#MODEL_PATH=/usr/share/supervisor/models/yolo11n_pose_cv181x_int8.cvimodel

# Exercise: squat | push_up | hammer_curl. Unset = whatever the console says.
#EXERCISE_MODE=squat
#TARGET_REPS=12
#TARGET_SETS=3

# Debug WebSocket stream (console preview). 0 disables.
#DEBUG_ENABLED=1
#DEBUG_PORT=8001

# Per-frame logging. Noisy; rep completions are logged either way.
#VERBOSE=0
