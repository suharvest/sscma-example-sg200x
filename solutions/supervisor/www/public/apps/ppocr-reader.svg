<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-label="Text recognition OCR preview">
  <style>
    .bg{fill:#eef2e6}.panel{fill:#ffffff}.doc{fill:#f4f7ee}.mut{fill:#c8d2bb}
    .txt{fill:#3a4633}.tline{fill:#c8d2bb}
    @media (prefers-color-scheme:dark){
      .bg{fill:#161a13}.panel{fill:#1e241a}.doc{fill:#232b1e}.mut{fill:#3a4633}
      .txt{fill:#c7d3b6}.tline{fill:#3a4633}
    }
  </style>
  <rect class="bg" width="400" height="210" rx="10"/>
  <rect class="panel" x="14" y="14" width="372" height="182" rx="8"/>
  <!-- document -->
  <rect class="doc" x="36" y="34" width="180" height="142" rx="7"/>
  <!-- text lines on document -->
  <g class="tline">
    <rect x="52" y="52" width="120" height="9" rx="3"/>
    <rect x="52" y="72" width="148" height="9" rx="3"/>
    <rect x="52" y="118" width="100" height="9" rx="3"/>
    <rect x="52" y="138" width="140" height="9" rx="3"/>
  </g>
  <!-- detected text region (highlighted) -->
  <rect x="48" y="88" width="120" height="20" rx="4" fill="none" stroke="#8fc31f" stroke-width="2.5"/>
  <rect x="52" y="93" width="96" height="10" rx="3" fill="#8fc31f"/>
  <!-- recognition output panel -->
  <g font-family="monospace" font-size="12">
    <rect x="240" y="52" width="128" height="106" rx="6" fill="none" stroke="#8fc31f" stroke-width="1.5"/>
    <text class="txt" x="252" y="74">"EXIT 12A"</text>
    <text class="txt" x="252" y="98" font-size="10" opacity="0.8">conf 0.97</text>
    <line x1="252" y1="110" x2="356" y2="110" stroke="#8fc31f" stroke-width="1" opacity="0.4"/>
    <text class="txt" x="252" y="130">"GATE 7"</text>
    <text class="txt" x="252" y="150" font-size="10" opacity="0.8">conf 0.91</text>
  </g>
</svg>
