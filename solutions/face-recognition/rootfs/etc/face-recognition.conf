# Face Recognition Configuration
# ReCamera Face Recognition Application (SG2002 / CV181x)

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# SCRFD-500M face detector + 5-point landmarks, INT8, 640x640 RGB.
DETECT_MODEL=/userdata/local/models/scrfd_500m_int8_qi.cvimodel
# MobileFaceNet ArcFace embedder, BF16, 112x112 RGB -> 512-D.
EMBED_MODEL=/userdata/local/models/arcface_mbf_bf16.cvimodel
# MiniFASNet-V2 2.7_80x80 anti-spoof, BF16, 80x80 BGR -> 3 logits.
LIVENESS_MODEL=/userdata/local/models/liveness_minifasnet_bf16.cvimodel
# MiniFASNet-V1SE 4.0_80x80, the second head of the v2 texture ensemble. The
# wider crop carries the bezel/paper edge that a tight face crop cannot see.
# OPTIONAL: if this file is absent the stage logs a warning and runs the V2 head
# alone. It does not fail startup.
LIVENESS_V1SE_MODEL=/userdata/local/models/liveness_minifasnet_v1se_bf16.cvimodel
# MediaPipe FaceMesh 468-point landmarks, BF16, 192x192 RGB. Used only for the
# eye-aspect-ratio blink signal. Also optional: without it, texture and motion
# still fuse.
FACEMESH_MODEL=/userdata/local/models/face_landmark_cv181x_bf16.cvimodel

# ---------------------------------------------------------------------------
# Gallery
# ---------------------------------------------------------------------------
# The filename encodes the model tag "cvi:scrfd500m+mbf512@bf16". Embeddings are
# NOT comparable across backends -- a gallery enrolled on a different
# accelerator scores cosine ~0 against this one, which would not fail loudly, it
# would simply recognise nobody. The application refuses to load a gallery whose
# _meta.model_tag disagrees.
GALLERY_PATH=/userdata/local/face-gallery/cvi_scrfd500m_mbf512_bf16.json

# Cosine above which an embedding is accepted as a gallery identity.
MATCH_THRESHOLD=0.40

# ---------------------------------------------------------------------------
# Detection
# ---------------------------------------------------------------------------
DET_THRESHOLD=0.5
NMS_THRESHOLD=0.4

# Faces whose SHORT SIDE is below this many pixels in the inference frame
# (INFERENCE_WIDTH x INFERENCE_HEIGHT below) are detected, tracked and published
# with "gated": true, but never embedded: at that size the 112x112 aligned chip
# is mostly interpolation and the cosine it produces is noise that would be
# written into the track's identity.
MIN_FACE_PX=64

# Re-embed a tracked face every N frames. Detection runs every frame; ArcFace
# does not, because a face that has not moved does not produce a new answer.
EMBED_INTERVAL=5

# ---------------------------------------------------------------------------
# Liveness (anti-spoof)
# ---------------------------------------------------------------------------
# Off by default: it costs extra inferences per visible face, and the models are
# loaded last so a failed allocation only disables this stage.
LIVENESS_ENABLED=0
# Legacy single-shot threshold. Still used for the one-frame decision during
# camera enrollment; the published verdict comes from the v2 fusion below.
LIVENESS_THRESHOLD=0.5

# --- Liveness v2: temporal fusion -----------------------------------------
# Three independent kinds of evidence are combined per TRACK, not per frame:
#   texture  MiniFAS V2 (2.7x) + V1SE (4.0x) ensemble mean, smoothed by an EMA.
#   motion   five-keypoint residual after a least-squares similarity fit is
#            removed, so approaching the camera is not "motion".
#   blink    EAR dips from sampled FaceMesh inferences.
# A blink proves liveness immediately. The ABSENCE of a blink never proves a
# spoof -- a still, unblinking subject falls back to texture.
#
# WARNING: every threshold below is provisional. None of them is derived from
# measurements on this device. Capture features with the liveness_capture MQTT
# command and fit them offline before trusting a verdict in production.

# EMA weight on each new texture sample (higher = faster, noisier).
LIVENESS_TEXTURE_EMA_ALPHA=0.4
# Texture samples required before any verdict other than "pending".
LIVENESS_MIN_SAMPLES=3
# Seconds of keypoint history retained for the motion fit.
LIVENESS_MOTION_WINDOW_SEC=1.75
# After this long with no usable motion, decide on texture alone -- with no
# motion penalty, because the weights are renormalized over available evidence.
LIVENESS_TIMEOUT_SEC=2.0
# Residual (in units of face short side) below which motion is detector jitter.
LIVENESS_MOTION_NOISE_FLOOR=0.006
# Residual at which the motion magnitude gate is fully open.
LIVENESS_MOTION_HIGH=0.020
# Temporal correlation ramp: ~0 is uncorrelated jitter, ~1 is a deformation
# whose direction persists across frames.
LIVENESS_CORRELATION_LOW=0.15
LIVENESS_CORRELATION_HIGH=0.65

# Run FaceMesh on every Nth frame. 0 disables blink evidence entirely, which is
# the cheapest way to claw back ION if the aggregate model budget is tight.
LIVENESS_FACEMESH_INTERVAL=3
LIVENESS_EAR_THRESHOLD=0.21
# A blink is 1..3 CONSECUTIVE SAMPLED FaceMesh observations below the threshold,
# followed by one above it. Longer closures are not blinks.
LIVENESS_BLINK_MIN_SAMPLES=1
LIVENESS_BLINK_MAX_SAMPLES=3

# Fusion weights, renormalized over whichever evidence exists this frame.
LIVENESS_W_TEXTURE=0.70
LIVENESS_W_MOTION=0.30
LIVENESS_W_DEPTH=0.20
# Added on top of the weighted score once a blink has been seen. At 1.0 the
# score saturates, which is what makes a blink decisive.
LIVENESS_BLINK_BONUS=1.0
# Hysteresis band. Inside [T_SPOOF, T_LIVE] the previous verdict is kept.
LIVENESS_T_LIVE=0.55
LIVENESS_T_SPOOF=0.35

# Depth evidence is a reCamera Pro extension point; there is no depth sensor on
# this device, so leaving this at 1 would only reserve weight for nothing.
LIVENESS_DEPTH_ENABLED=0

# Calibration capture (MQTT op "liveness_capture"). One JSONL row per eligible
# face per frame: features only -- never pixels, embeddings or names. Capture
# forces both texture heads every frame, so it is more expensive than steady
# state. The path must be writable; /usr/local/bin is not.
LIVENESS_CAPTURE_MAX_SEC=60
LIVENESS_CAPTURE_PATH=/userdata/local/face-gallery/liveness_capture.jsonl

# ---------------------------------------------------------------------------
# MQTT
# ---------------------------------------------------------------------------
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/face-recognition/results
# Enrollment / admin commands are read from recamera/face-recognition/cmd and
# acknowledged on recamera/face-recognition/cmd/ack.

# Privacy blur is configured device-wide in /userdata/local/blur.conf, written
# by the console. Only the region cap lives here.
MAX_REGIONS=12

# ---------------------------------------------------------------------------
# Video
# ---------------------------------------------------------------------------
RTSP_ENABLED=1
STREAM_WIDTH=1280
STREAM_HEIGHT=720
STREAM_FPS=15

INFERENCE_WIDTH=640
INFERENCE_HEIGHT=480
INFERENCE_FPS=10

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
VERBOSE=0
