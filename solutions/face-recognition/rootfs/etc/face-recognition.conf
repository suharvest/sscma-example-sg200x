# Face Recognition Configuration
# ReCamera Face Recognition Application (SG2002 / CV181x)

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# SCRFD-500M face detector + 5-point landmarks, INT8, 640x640 RGB.
DETECT_MODEL=/userdata/local/models/scrfd_500m_int8.cvimodel
# MobileFaceNet ArcFace embedder, BF16, 112x112 RGB -> 512-D.
EMBED_MODEL=/userdata/local/models/arcface_mbf_bf16.cvimodel
# MiniFASNet 2.7_80x80 anti-spoof, BF16, 80x80 BGR -> 3 logits.
LIVENESS_MODEL=/userdata/local/models/liveness_minifasnet_bf16.cvimodel

# ---------------------------------------------------------------------------
# Gallery
# ---------------------------------------------------------------------------
# The filename encodes the model tag "cvi:scrfd500m+mbf512@bf16". Embeddings are
# NOT comparable across backends -- a gallery enrolled on a different
# accelerator scores cosine ~0 against this one, which would not fail loudly, it
# would simply recognise nobody. The application refuses to load a gallery whose
# _meta.model_tag disagrees.
GALLERY_PATH=/userdata/local/face-gallery/cvi_scrfd500m_mbf512_bf16.json

# Cosine above which an embedding is accepted as a gallery identity.
MATCH_THRESHOLD=0.40

# ---------------------------------------------------------------------------
# Detection
# ---------------------------------------------------------------------------
DET_THRESHOLD=0.5
NMS_THRESHOLD=0.4

# Faces whose SHORT SIDE is below this many pixels in the inference frame
# (INFERENCE_WIDTH x INFERENCE_HEIGHT below) are detected, tracked and published
# with "gated": true, but never embedded: at that size the 112x112 aligned chip
# is mostly interpolation and the cosine it produces is noise that would be
# written into the track's identity.
MIN_FACE_PX=64

# Re-embed a tracked face every N frames. Detection runs every frame; ArcFace
# does not, because a face that has not moved does not produce a new answer.
EMBED_INTERVAL=5

# ---------------------------------------------------------------------------
# Liveness (anti-spoof)
# ---------------------------------------------------------------------------
# Off by default: it costs an extra inference per embedded face, and the model
# is loaded last so a failed allocation only disables this stage.
LIVENESS_ENABLED=0
LIVENESS_THRESHOLD=0.5

# ---------------------------------------------------------------------------
# MQTT
# ---------------------------------------------------------------------------
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=recamera/face-recognition/results
# Enrollment / admin commands are read from recamera/face-recognition/cmd and
# acknowledged on recamera/face-recognition/cmd/ack.

# Privacy blur is configured device-wide in /userdata/local/blur.conf, written
# by the console. Only the region cap lives here.
MAX_REGIONS=12

# ---------------------------------------------------------------------------
# Video
# ---------------------------------------------------------------------------
RTSP_ENABLED=1
STREAM_WIDTH=1280
STREAM_HEIGHT=720
STREAM_FPS=15

INFERENCE_WIDTH=640
INFERENCE_HEIGHT=480
INFERENCE_FPS=10

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
VERBOSE=0
