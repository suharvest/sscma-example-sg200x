# fall-detection configuration (sourced by /etc/init.d/K92fall-detection)
#
# The console-managed JSON file contains detection thresholds. Values here are
# deployment escape hatches for MQTT/debug/model selection and are optional.

#MQTT_HOST=localhost
#MQTT_PORT=1883
#MQTT_TOPIC=recamera/fall-detection/results

# Default is the YOLO11n-Pose model shipped with the supervisor.
#MODEL_PATH=/usr/share/supervisor/models/yolo11n_pose_cv181x_int8.cvimodel

#DEBUG_ENABLED=1
#DEBUG_PORT=8001
#VERBOSE=0
