# PP-OCR Reader Configuration
# This file is sourced by /etc/init.d/K92ppocr-reader.
# All settings are optional; uncomment to override the defaults.

# Pipeline components (defaults match the app manifest)
#DET_MODEL=/userdata/local/models/ppocr_det_cv181x_mix.cvimodel
#REC_MODEL=/userdata/local/models/ppocr_rec_cv181x_bf16.cvimodel
#DICT_FILE=/userdata/local/dict/ppocr_keys_v1.txt
# English-only variant (smaller dictionary, faster decode):
#REC_MODEL=/userdata/local/models/ppocr_rec_en_cv181x_bf16.cvimodel
#DICT_FILE=/userdata/local/dict/en_dict.txt

# MQTT broker (defaults: localhost:1883, topic recamera/ppocr/texts)
#MQTT_HOST=192.168.1.100
#MQTT_PORT=1883
#MQTT_TOPIC=recamera/ppocr/texts

# Debug WebSocket stream for the console Live page (default: enabled, port 8001)
#DEBUG_ENABLED=0
#DEBUG_PORT=8001

# Max text boxes recognized per frame (default: 5, 0 = unlimited)
#KMAX=5

# Image enhancement before recognition: none, clahe, gray, adaptive
#ENHANCE_MODE=none

# Verbose logging (1 = enable)
#VERBOSE=0

# Extra flags appended to the daemon command line, e.g.:
#DAEMON_OPTS="$DAEMON_OPTS --no-rtsp"
